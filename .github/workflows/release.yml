name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish from a v* tag after registry setup (otherwise build artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: uv run python scripts/check_release.py
      - run: uv build --out-dir dist/server
      - run: uv build sdk/python --out-dir dist/sdk
      - run: cd sdk/typescript && npm ci && npm run build && npm pack --pack-destination ../../dist
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate distribution/mcpb/manifest.json
      - run: uv run python scripts/build_agent_bundle.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: agentbox-release
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) && vars.PUBLISH_PYPI == 'true'
    needs: artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: agentbox-release, path: dist}
      # Only the requested SDK: ownership of the existing PyPI name 'agentbox' has not been verified.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/sdk/}

  npm:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) && vars.PUBLISH_NPM == 'true'
    needs: artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: "24", registry-url: "https://registry.npmjs.org"}
      - uses: actions/download-artifact@v4
        with: {name: agentbox-release, path: dist}
      - run: npm publish dist/agentbox-sdk-*.tgz --access public --provenance

  image:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) && vars.PUBLISH_IMAGE == 'true'
    needs: artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/slimper/agentbox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
