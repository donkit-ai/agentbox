name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:

jobs:
  sdk-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
        mcp: ["mcp>=1.26,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: >-
          uv run --no-project --python '${{ matrix.python }}'
          --with './sdk/python[mcp]' --with '${{ matrix.mcp }}'
          python -c 'import asyncio; from agentbox_sdk import AsyncAgentBox; from agentbox_sdk.mcp_server import build_server; from agentbox_sdk.mcp_http import create_http_app; assert asyncio.run(build_server().list_tools()); assert create_http_app()'
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agentbox, POSTGRES_PASSWORD: agentbox, POSTGRES_DB: agentbox }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U agentbox" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # service containers cannot take a command, and MinIO's official image needs `server`; the app creates buckets itself
      - run: |
          docker run -d --name minio -p 9010:9000 -e MINIO_ROOT_USER=agentbox -e MINIO_ROOT_PASSWORD=agentbox123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9010/minio/health/live && break; sleep 1; done
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: |
          uv run python sdk/python/scripts/generate_async.py
          uv run ruff format sdk/python/agentbox_sdk/async_client.py
          uv run ruff check --fix sdk/python/agentbox_sdk/async_client.py
          git diff --exit-code -- sdk/python/agentbox_sdk/async_client.py
      - run: psql postgresql://agentbox:agentbox@localhost:5434/agentbox -c "CREATE DATABASE agentbox_test;"
      - run: cd sdk/typescript && npm ci --silent && npm run build
      - run: uv run pytest -q --tb=short --show-capture=no
        env:
          AGENTBOX_TEST_DATABASE_URL: postgresql+asyncpg://agentbox:agentbox@localhost:5434/agentbox_test
          AGENTBOX_S3_ENDPOINT: http://localhost:9010
          AGENTBOX_OUTBOUND_SMTP_HOST: localhost
          AGENTBOX_OUTBOUND_SMTP_PORT: "1025"
