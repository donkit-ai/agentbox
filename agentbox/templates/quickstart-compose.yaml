services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: agentbox, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}", POSTGRES_DB: agentbox }
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentbox"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:latest
    command: server /data
    environment: { MINIO_ROOT_USER: agentbox, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?}" }
    ports: ["127.0.0.1:${AGENTBOX_STORAGE_PORT}:9000"]
    volumes: ["objects:/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${AGENTBOX_MAILPIT_PORT}:8025"]
  migrate:
    image: ${AGENTBOX_IMAGE:?}
    command: agentbox migrate
    environment: &environment
      AGENTBOX_DATABASE_URL: postgresql+asyncpg://agentbox:${POSTGRES_PASSWORD}@postgres:5432/agentbox
      AGENTBOX_S3_ENDPOINT: http://minio:9000
      AGENTBOX_S3_PUBLIC_ENDPOINT: http://localhost:${AGENTBOX_STORAGE_PORT}
      AGENTBOX_S3_ACCESS_KEY: agentbox
      AGENTBOX_S3_SECRET_KEY: ${MINIO_PASSWORD}
      AGENTBOX_APP_SECRET_KEY: ${AGENTBOX_APP_SECRET_KEY:?}
      AGENTBOX_EDITION: oss
      AGENTBOX_PUBLIC_BASE_URL: ${AGENTBOX_PUBLIC_BASE_URL}
      AGENTBOX_API_BASE_URL: ${AGENTBOX_PUBLIC_BASE_URL}
      AGENTBOX_MANAGED_DOMAIN: agentbox.local
      AGENTBOX_OUTBOUND_SMTP_HOST: mailpit
      AGENTBOX_OUTBOUND_SMTP_PORT: "1025"
      AGENTBOX_DOCTOR_SMTP_HOST: smtp
      AGENTBOX_GOOGLE_CLIENT_ID: ${AGENTBOX_GOOGLE_CLIENT_ID:-}
      AGENTBOX_GOOGLE_CLIENT_SECRET: ${AGENTBOX_GOOGLE_CLIENT_SECRET:-}
      AGENTBOX_M365_CLIENT_ID: ${AGENTBOX_M365_CLIENT_ID:-}
      AGENTBOX_M365_CLIENT_SECRET: ${AGENTBOX_M365_CLIENT_SECRET:-}
      AGENTBOX_M365_TENANT: ${AGENTBOX_M365_TENANT:-common}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    restart: on-failure
  api:
    image: ${AGENTBOX_IMAGE:?}
    command: agentbox api
    environment: *environment
    ports: ["127.0.0.1:${AGENTBOX_HTTP_PORT:-8000}:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    image: ${AGENTBOX_IMAGE:?}
    command: agentbox worker
    environment: *environment
    depends_on: { migrate: { condition: service_completed_successfully } }
  smtp:
    image: ${AGENTBOX_IMAGE:?}
    command: agentbox smtp
    environment: *environment
    ports: ["127.0.0.1:${AGENTBOX_SMTP_PORT}:2525"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  database:
  objects:
