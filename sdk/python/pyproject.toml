[project]
name = "agentbox-sdk"
version = "0.2.0"
description = "Python SDK and MCP server for AgentBox — programmable email identities for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typing-extensions>=4.7"]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<3"]

[project.urls]
Repository = "https://github.com/donkit-ai/agentbox"
Documentation = "https://github.com/donkit-ai/agentbox/blob/main/docs/agents.md"

[project.scripts]
agentbox-mcp = "agentbox_sdk.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentbox_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"agentbox_sdk/mcp_server.py" = ["E501"]
